name: Test Commit Bloom Worker
on:
  push:
    paths:
      - 'cloudflare/**'
      - 'scripts/calendar.mjs'
      - 'artwork/calendar/watercolor-sprites.json'
      - '.github/workflows/cloudflare-test.yml'
  pull_request:
    paths:
      - 'cloudflare/**'
      - 'scripts/calendar.mjs'
      - 'artwork/calendar/watercolor-sprites.json'
      - '.github/workflows/cloudflare-test.yml'
permissions:
  contents: read
jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: cloudflare
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json
      - run: npm ci
      - run: npm test
