name: Render botanical README

on:
  workflow_dispatch:
    inputs:
      commits:
        description: 'Demo commit count (0–20000)'
        required: true
        default: '1000'
      goal:
        description: 'Full color target (1–20000)'
        required: true
        default: '3000'

permissions:
  contents: read

concurrency:
  group: botanical-render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - name: Generate SVG and README
        env:
          DEMO_COMMITS: ${{ inputs.commits }}
          COLOR_GOAL: ${{ inputs.goal }}
        run: node scripts/render.mjs "$DEMO_COMMITS" "$COLOR_GOAL"
      - name: Commit generated images
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md PROFILE-EMBED.md images
          if git diff --cached --quiet; then
            echo 'Images already match the requested state.'
          else
            git commit -m 'Update botanical README images'
            git push origin HEAD:main
          fi
