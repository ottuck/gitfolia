name: Legacy goal-based botanical study

on:
  workflow_dispatch:
    inputs:
      commits:
        description: 'Demo commit count (0–50000)'
        required: true
        default: '1500'
      goal:
        description: 'Full color target (1–50000)'
        required: true
        default: '3000'
      mode:
        description: 'Paint order'
        type: choice
        options: [spread, leaf, random]
        default: spread
      year:
        description: 'Year / stable seed'
        default: '2026'

permissions:
  contents: read

concurrency:
  group: botanical-render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm run verify
      - name: Generate SVG and README
        env:
          DEMO_COMMITS: ${{ inputs.commits }}
          COLOR_GOAL: ${{ inputs.goal }}
          COLOR_MODE: ${{ inputs.mode }}
          COLOR_YEAR: ${{ inputs.year }}
        run: node scripts/render-v2.mjs "$DEMO_COMMITS" "$COLOR_GOAL" "$COLOR_MODE" "$COLOR_YEAR"
      - name: Commit generated images
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md PROFILE-EMBED.md images
          if git diff --cached --quiet; then
            echo 'Images already match the requested state.'
          else
            git commit -m 'Update botanical README images'
            git push origin HEAD:main
          fi
