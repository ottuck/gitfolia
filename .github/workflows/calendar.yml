name: Update botanical calendar

on:
  workflow_dispatch:
    inputs:
      login:
        description: 'GitHub account'
        default: 'ottuck'
        required: true
      year:
        description: 'Calendar year (blank = current UTC year)'
        default: ''
  schedule:
    - cron: '20 0 * * *'

permissions:
  contents: read

concurrency:
  group: botanical-render
  cancel-in-progress: false

jobs:
  calendar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm run verify
      - name: Collect GitHub contributions and render three themes
        env:
          GH_TOKEN: ${{ secrets.BOTANICAL_TOKEN || github.token }}
          CALENDAR_LOGIN: ${{ inputs.login || 'ottuck' }}
          CALENDAR_YEAR: ${{ inputs.year }}
        run: |
          year="${CALENDAR_YEAR:-$(date -u +%Y)}"
          node scripts/render-calendar.mjs "$CALENDAR_LOGIN" "$year" github
      - name: Verify all painted dates against a fresh GitHub response
        env:
          GH_TOKEN: ${{ secrets.BOTANICAL_TOKEN || github.token }}
        run: npm run verify:actual
      - name: Commit calendar images
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md PROFILE-EMBED.md images
          if ! git diff --cached --quiet; then
            git commit -m 'Update daily botanical contribution calendar'
            git push origin HEAD:main
          fi
